worker_processes auto;
worker_rlimit_nofile 16384;
events { worker_connections 4096; }

# =====================================================================
# Lớp TCP (stream) — C3: chống Slowloris / cạn kết nối
# limit_conn của khối http CHỈ đếm kết nối đã gửi xong header, nên kết nối
# nhỏ giọt header không bị giới hạn. Ở lớp stream, limit_conn đếm MỌI kết nối
# TCP ngay khi bắt tay -> mỗi IP tối đa 20 kết nối đồng thời, kể cả kết nối
# chưa gửi byte nào. IP thật được chuyển sang khối http bằng PROXY protocol.
# =====================================================================
stream {
    limit_conn_zone $binary_remote_addr zone=tcp_per_ip:10m;
    limit_conn_log_level warn;

    server {
        listen 80;
        limit_conn tcp_per_ip 20;
        proxy_pass 127.0.0.1:8080;
        proxy_protocol on;
        proxy_connect_timeout 3s;
    }
    server {                                   # HTTPS: chuyển nguyên byte TLS, khối http bên dưới giải mã
        listen 443;
        limit_conn tcp_per_ip 20;
        proxy_pass 127.0.0.1:8443;
        proxy_protocol on;
        proxy_connect_timeout 3s;
    }
}

http {
    # IP thật do lớp stream ở trên gửi qua PROXY protocol (chỉ tin loopback)
    set_real_ip_from 127.0.0.1;
    real_ip_header   proxy_protocol;

    # khoá "<ip>|<User-Agent>" dài tới ~300 byte: hai chỉ thị này phải đứng TRƯỚC khối map đầu tiên
    map_hash_bucket_size 512;
    map_hash_max_size    65536;
    map $remote_addr $blocked_ip {
        default 0;
        include /etc/nginx/blocklist/blocklist.map;
    }
    # D1: IP dùng chung (NAT) bị chặn theo cặp (IP, User-Agent) — người khác sau cùng NAT vẫn vào được
    map "$remote_addr|$http_user_agent" $blocked_fp {
        default 0;
        include /etc/nginx/blocklist/blockfp.map;
    }
    map "$blocked_ip$blocked_fp" $blocked { "00" 0; default 1; }
    log_format main '$proxy_protocol_addr "$request" $status blocked=$blocked';
    access_log /dev/stdout main;
    # Nhật ký JSON CHỈ cho request bị Cổng 1 từ chối (403 vì IP đang bị chặn, 429 vì vượt giới hạn kết nối).
    # Filebeat chuyển tệp này vào đường ống (topic gate1.logs) để thấy IP bị chặn vẫn đang làm gì.
    # C5: ghi MỌI phản hồi lỗi do chính nginx sinh ra (không qua Apache: $upstream_status rỗng) — 403 vì bị chặn,
    # 429 vì vượt giới hạn kết nối, 400/408/414/431/494/505... vì request dị dạng. Trước đây chỉ có 403/429 nên
    # request dị dạng bị nginx từ chối không vào đường ống (chỉ Suricata thấy, và chỉ qua HTTP).
    map "$status:$upstream_status" $gate1_log { "~^[45][0-9][0-9]:$" 1; default 0; }
    # src_ip = $proxy_protocol_addr (IP thật lấy ngay khi nhận kết nối); $remote_addr chỉ đổi sang IP thật SAU khi đọc
    # xong header, nên request hỏng (400/414/505) bị ghi là 127.0.0.1 (đã đo ở kịch bản 08)
    log_format gate1 escape=json '{"ts":$msec,"src_ip":"$proxy_protocol_addr","method":"$request_method",'
                                 '"uri":"$request_uri","status":$status,"blocked":$blocked,"fp_blocked":$blocked_fp,'
                                 '"ua":"$http_user_agent","host":"$host","request":"$request","bytes_in":$request_length}';
    access_log /var/log/nginx-json/gate1.json gate1 if=$gate1_log;
    error_log  /dev/stderr warn;
    server_tokens off;

    # giới hạn số REQUEST đồng thời / IP + cắt client gửi chậm (header hoặc body nhỏ giọt)
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn_status 429;
    client_header_timeout 8s;
    client_body_timeout   8s;
    send_timeout          10s;

    # ===== Cổng 1 — HTTP =====
    server {
        listen 127.0.0.1:8080 proxy_protocol default_server;
        limit_conn conn_per_ip 10;
        if ($blocked) { return 403; }
        location / {
            proxy_pass http://apache:80;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }
    }

    # ===== C1 — HTTPS =====
    # nginx CHẤM DỨT TLS (giải mã) rồi proxy HTTP sang apache.
    # => Suricata ở external_net chỉ thấy byte đã mã hoá (chỉ bắt được handshake),
    #    còn Filebeat đọc log apache vẫn thấy nội dung đã giải mã.
    server {
        listen 127.0.0.1:8443 ssl proxy_protocol default_server;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        limit_conn conn_per_ip 10;
        if ($blocked) { return 403; }
        location / {
            proxy_pass http://apache:80;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
