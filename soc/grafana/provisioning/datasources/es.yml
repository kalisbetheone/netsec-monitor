apiVersion: 1
datasources:
  - name: web-events
    uid: webevents
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    basicAuth: true
    basicAuthUser: grafana_ro                       # tài khoản chỉ đọc, tạo bởi soc/es-init.sh
    secureJsonData: {basicAuthPassword: "${GRAFANA_ES_PASSWORD}"}
    jsonData: {index: "web-events-*", timeField: "@timestamp"}
