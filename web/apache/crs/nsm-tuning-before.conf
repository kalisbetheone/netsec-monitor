# NSM — ngoại lệ CRS 4.25 cho truy vấn GraphQL (plugin *-before.conf: nạp TRƯỚC các tệp luật của CRS)
#
# Đo 14/11/2026 (kịch bản 32): 39/97 request lành tính bị chặn nhầm là truy vấn GraphQL trong thân JSON
# (vd [{"operationName":"RECOMMENDATIONS_QUERY","query":"{ url ... }","variables":{...}}], các biến $or/$gt/$eq).
# Cú pháp GraphQL khớp nhầm: 932370 (chèn lệnh Windows: "{ url", "{\n control"), 932230 / 932250 (chèn lệnh Unix),
# 942290 (toán tử MongoDB "$or", "$gt"). 16/11/2026: thêm 932235 (chèn lệnh Unix, khớp "{\n node") — 8/86 lần chặn nhầm của mẫu
# quan sát, cùng phạm vi hẹp dưới đây.
#
# Phạm vi HẸP: chỉ request thân JSON VÀ (có tham số operationName — chuẩn của client GraphQL — HOẶC đường dẫn chứa
# 'graphql'); chỉ gỡ đúng tham số 'query' (tên theo bộ xử lý JSON của ModSecurity: query / array.array.query) khỏi đúng
# 4 luật trên. Mọi luật khác (SQLi libinjection 942100, XSS, LFI, RCE PHP...) vẫn soi tham số này; classifier vẫn quét.
# Dải ID 1000100–1000199 dành cho tinh chỉnh của NSM (ngoài dải CRS 900000–999999 và dải luật tự sinh 9900000+).

SecRule REQUEST_HEADERS:Content-Type "@rx ^application/(?:graphql\+)?json" \
    "id:1000100,phase:2,pass,nolog,t:none,t:lowercase,chain"
    SecRule ARGS_NAMES "@rx (?:^|\.)operationname$" \
        "t:none,t:lowercase,\
        ctl:ruleRemoveTargetById=932370;ARGS:query,ctl:ruleRemoveTargetById=932370;ARGS:array.array.query,\
        ctl:ruleRemoveTargetById=932230;ARGS:query,ctl:ruleRemoveTargetById=932230;ARGS:array.array.query,\
        ctl:ruleRemoveTargetById=932250;ARGS:query,ctl:ruleRemoveTargetById=932250;ARGS:array.array.query,\
        ctl:ruleRemoveTargetById=942290;ARGS:query,ctl:ruleRemoveTargetById=942290;ARGS:array.array.query,\
        ctl:ruleRemoveTargetById=932235;ARGS:query,ctl:ruleRemoveTargetById=932235;ARGS:array.array.query"

SecRule REQUEST_HEADERS:Content-Type "@rx ^application/(?:graphql\+)?json" \
    "id:1000101,phase:2,pass,nolog,t:none,t:lowercase,chain"
    SecRule REQUEST_FILENAME "@contains graphql" \
        "t:none,t:lowercase,\
        ctl:ruleRemoveTargetById=932370;ARGS:query,ctl:ruleRemoveTargetById=932370;ARGS:array.array.query,\
        ctl:ruleRemoveTargetById=932230;ARGS:query,ctl:ruleRemoveTargetById=932230;ARGS:array.array.query,\
        ctl:ruleRemoveTargetById=932250;ARGS:query,ctl:ruleRemoveTargetById=932250;ARGS:array.array.query,\
        ctl:ruleRemoveTargetById=942290;ARGS:query,ctl:ruleRemoveTargetById=942290;ARGS:array.array.query,\
        ctl:ruleRemoveTargetById=932235;ARGS:query,ctl:ruleRemoveTargetById=932235;ARGS:array.array.query"


# ---------------------------------------------------------------------------------------------------------------------
# 16/11/2026 — ngoại lệ viết từ mẫu QUAN SÁT (scenarios/crs/quan-sat, 86/2 000 request hợp lệ thật bị chặn) và bảng luật của
# lượt kịch bản 42 sáng 16/11. Tiêu chí giữ / bỏ ghi trước trong eval/PROTOCOL.md (mục 16/11 12:15). Mỗi ngoại lệ gỡ MỘT luật
# khỏi MỘT tham số; mọi luật khác (trong đó có libinjection 942100) vẫn soi các tham số này, classifier vẫn quét.

# (1) Hai kiểu nội dung JSON vừa được cho phép (nsm-tuning-config.conf) phải được tách bằng bộ xử lý JSON để CRS soi thân.
SecRule REQUEST_HEADERS:Content-Type "@rx ^application/(?:csp-report|vnd\.api\+json)" \
    "id:1000110,phase:1,pass,nolog,t:none,t:lowercase,ctl:requestBodyProcessor=JSON"

# (2) 942550 "JSON-Based SQL Injection" khớp nhầm khi tham số 'data' / 'options' CHÍNH LÀ một tài liệu JSON (giỏ hàng, cấu hình
#     trình tải...): 13/35 lần chặn nhầm ở lượt kịch bản 42, 4/86 ở mẫu quan sát. Chỉ gỡ khi giá trị bắt đầu bằng { hoặc [.
SecRule ARGS:data "@rx ^\s*[\{\[]" \
    "id:1000111,phase:2,pass,nolog,t:none,ctl:ruleRemoveTargetById=942550;ARGS:data"
SecRule ARGS:options "@rx ^\s*[\{\[]" \
    "id:1000112,phase:2,pass,nolog,t:none,ctl:ruleRemoveTargetById=942550;ARGS:options"

# (3) Tham số của các thư viện đo lường phổ biến:
#     931120 (RFI: URL kết thúc bằng '?') trên 'dl' — "document location" của Google Analytics (9/86; 3/35 ở lượt kịch bản 42);
#     921130 (tách phản hồi HTTP, khớp chuỗi "http/1.1") trên 'nt_protocol', 'ak.proto' — tham số giao thức của boomerang / mPulse.
SecAction \
    "id:1000113,phase:1,pass,nolog,t:none,\
    ctl:ruleRemoveTargetById=931120;ARGS:dl,\
    ctl:ruleRemoveTargetById=921130;ARGS:nt_protocol,\
    ctl:ruleRemoveTargetById=921130;ARGS:ak.proto"
