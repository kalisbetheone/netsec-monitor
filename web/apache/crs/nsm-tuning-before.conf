# NSM — ngoại lệ CRS 4.25 cho truy vấn GraphQL (plugin *-before.conf: nạp TRƯỚC các tệp luật của CRS)
#
# Đo 14/11/2026 (kịch bản 32): 39/97 request lành tính bị chặn nhầm là truy vấn GraphQL trong thân JSON
# (vd [{"operationName":"RECOMMENDATIONS_QUERY","query":"{ url ... }","variables":{...}}], các biến $or/$gt/$eq).
# Cú pháp GraphQL khớp nhầm: 932370 (chèn lệnh Windows: "{ url", "{\n control"), 932230 / 932250 (chèn lệnh Unix),
# 942290 (toán tử MongoDB "$or", "$gt").
#
# Phạm vi HẸP: chỉ request thân JSON VÀ (có tham số operationName — chuẩn của client GraphQL — HOẶC đường dẫn chứa
# 'graphql'); chỉ gỡ đúng tham số 'query' (tên theo bộ xử lý JSON của ModSecurity: query / array.array.query) khỏi đúng
# 4 luật trên. Mọi luật khác (SQLi libinjection 942100, XSS, LFI, RCE PHP...) vẫn soi tham số này; classifier vẫn quét.
# Dải ID 1000100–1000199 dành cho tinh chỉnh của NSM (ngoài dải CRS 900000–999999 và dải luật tự sinh 9900000+).

SecRule REQUEST_HEADERS:Content-Type "@rx ^application/(?:graphql\+)?json" \
    "id:1000100,phase:2,pass,nolog,t:none,t:lowercase,chain"
    SecRule ARGS_NAMES "@rx (?:^|\.)operationname$" \
        "t:none,t:lowercase,\
        ctl:ruleRemoveTargetById=932370;ARGS:query,ctl:ruleRemoveTargetById=932370;ARGS:array.array.query,\
        ctl:ruleRemoveTargetById=932230;ARGS:query,ctl:ruleRemoveTargetById=932230;ARGS:array.array.query,\
        ctl:ruleRemoveTargetById=932250;ARGS:query,ctl:ruleRemoveTargetById=932250;ARGS:array.array.query,\
        ctl:ruleRemoveTargetById=942290;ARGS:query,ctl:ruleRemoveTargetById=942290;ARGS:array.array.query"

SecRule REQUEST_HEADERS:Content-Type "@rx ^application/(?:graphql\+)?json" \
    "id:1000101,phase:2,pass,nolog,t:none,t:lowercase,chain"
    SecRule REQUEST_FILENAME "@contains graphql" \
        "t:none,t:lowercase,\
        ctl:ruleRemoveTargetById=932370;ARGS:query,ctl:ruleRemoveTargetById=932370;ARGS:array.array.query,\
        ctl:ruleRemoveTargetById=932230;ARGS:query,ctl:ruleRemoveTargetById=932230;ARGS:array.array.query,\
        ctl:ruleRemoveTargetById=932250;ARGS:query,ctl:ruleRemoveTargetById=932250;ARGS:array.array.query,\
        ctl:ruleRemoveTargetById=942290;ARGS:query,ctl:ruleRemoveTargetById=942290;ARGS:array.array.query"
