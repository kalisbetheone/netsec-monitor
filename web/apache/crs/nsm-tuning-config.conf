# NSM — tinh chỉnh CRS 4.25 (plugin *-config.conf: nạp SAU crs-setup.conf, TRƯỚC các tệp luật)
#
# Đo 14/11/2026 (kịch bản 32: phát lại 600 request lành tính THẬT của website chưa thấy, tập test_sites openappsec):
# CRS chặn nhầm 97/600 = 16,2 %. 52/97 do luật 920420 "Request content type is not allowed by policy" với
# Content-Type: text/plain — kiểu thân chuẩn của navigator.sendBeacon (analytics, nhật ký phía trình duyệt).
#
# Thêm text/plain vào danh sách cho phép (giữ nguyên danh sách mặc định của CRS 4.25).
# 16/11/2026 (mẫu quan sát 2 000 request, scenarios/crs/quan-sat: 17/86 lần chặn nhầm do luật 920420): thêm ba kiểu chuẩn —
# application/csp-report (trình duyệt gửi báo cáo vi phạm CSP), application/vnd.api+json (chuẩn JSON:API), text/ping (thuộc tính
# ping của thẻ <a>). Hai kiểu JSON được giao cho bộ xử lý JSON (luật 1000110 trong nsm-tuning-before.conf) nên CRS vẫn soi thân.
# KHÔNG thêm các kiểu riêng của một dịch vụ (application/vnd.chrome.uma, x-amz-json-1.1, json+protobuf, message/ohttp-req).
#
# RỦI RO ĐÃ BIẾT: ModSecurity không có bộ xử lý thân cho text/plain nên CRS không tách thân thành ARGS để soi; thân vẫn
# được classifier của NSM quét (tầng 1 + tầng 2) và được ghi vào nhật ký kiểm toán.
SecAction \
    "id:900220,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    ver:'OWASP_CRS/4.25.0',\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json| |text/plain| |application/csp-report| |application/vnd.api+json| |text/ping|'"
