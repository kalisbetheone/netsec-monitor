# SINH TỰ ĐỘNG bởi tools/gen_tier1_modsec.py từ services/classifier.py (_RULES, SCANNER_UA). KHÔNG SỬA TAY:
# sửa regex trong classifier rồi chạy lại bộ sinh (tests/test_logic.py kiểm tra tệp này khớp mã nguồn).
# Mục đích: chặn ĐỒNG BỘ ở Cổng 2 đúng những gì tầng 1 của classifier coi là chắc chắn, nên request tấn công
# ĐẦU TIÊN mà CRS bỏ lọt đã bị 403 thay vì tới ứng dụng rồi mới bị phát hiện. Nạp sau CRS và luật tự sinh.

# thân THÔ (STREAM_INPUT_BODY) cho thân XML/multipart — ModSecurity 2.9.7 không có biến nào khác giữ thân thô
# khi bộ xử lý XML/multipart chạy
SecStreamInBodyInspection On

# sqli / phạm vi any: 9 mẫu
SecRule REQUEST_FILENAME|ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_HEADERS:User-Agent "@rx (?:\bunion\b.{0,40}\bselect\b)|(?:['\"\d)]\s*\b(?:or|and)\b\s*['\"(]?\d+['\")]?\s*=\s*['\"(]?\d+)|(?:'\s*(?:or|and)\s+')|(?:\b(?:sleep|benchmark|pg_sleep)\s*\()|(?:\binformation_schema\b)|(?:;\s*(?:drop|insert|update|delete)\s)|(?:'\s*--)|(?:(?:extractvalue|updatexml|load_file|group_concat)\s*\()|(?:'\s*(?:or|and)\s+\w+\s*\()" "id:1000200,phase:2,deny,status:403,log,auditlog,t:none,t:lowercase,t:compressWhitespace,t:urlDecodeUni,t:urlDecodeUni,t:compressWhitespace,multiMatch,msg:'NSM tier1 sqli',tag:'nsm/tier1',tag:'nsm/tier1/sqli',tag:'nsm/scope/any',logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',severity:'CRITICAL'"
SecRule REQBODY_PROCESSOR "@rx ^(?:XML|MULTIPART)$" "id:1000201,phase:2,deny,status:403,log,auditlog,t:none,msg:'NSM tier1 sqli',tag:'nsm/tier1',tag:'nsm/tier1/sqli',tag:'nsm/scope/any',logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',severity:'CRITICAL',chain"
    SecRule STREAM_INPUT_BODY "@rx (?:\bunion\b.{0,40}\bselect\b)|(?:['\"\d)]\s*\b(?:or|and)\b\s*['\"(]?\d+['\")]?\s*=\s*['\"(]?\d+)|(?:'\s*(?:or|and)\s+')|(?:\b(?:sleep|benchmark|pg_sleep)\s*\()|(?:\binformation_schema\b)|(?:;\s*(?:drop|insert|update|delete)\s)|(?:'\s*--)|(?:(?:extractvalue|updatexml|load_file|group_concat)\s*\()|(?:'\s*(?:or|and)\s+\w+\s*\()" "t:none,t:lowercase,t:compressWhitespace"

# xss / phạm vi any: 5 mẫu
SecRule REQUEST_FILENAME|ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_HEADERS:User-Agent "@rx (?:<\s*script)|(?:javascript\s*:(?!\s*(?:void\s*\(\s*0\s*\)\s*;?|;)?\s*(?:$|[\"',}\]&])))|(?:\bon(?:error|load|mouseover|focus|click)\s*=)|(?:<\s*(?:img|svg|iframe|body)\b[^<>]{0,512}\bon\w+)|(?:document\.(?:cookie|domain))" "id:1000202,phase:2,deny,status:403,log,auditlog,t:none,t:lowercase,t:compressWhitespace,t:urlDecodeUni,t:urlDecodeUni,t:compressWhitespace,multiMatch,msg:'NSM tier1 xss',tag:'nsm/tier1',tag:'nsm/tier1/xss',tag:'nsm/scope/any',logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',severity:'CRITICAL'"
SecRule REQBODY_PROCESSOR "@rx ^(?:XML|MULTIPART)$" "id:1000203,phase:2,deny,status:403,log,auditlog,t:none,msg:'NSM tier1 xss',tag:'nsm/tier1',tag:'nsm/tier1/xss',tag:'nsm/scope/any',logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',severity:'CRITICAL',chain"
    SecRule STREAM_INPUT_BODY "@rx (?:<\s*script)|(?:javascript\s*:(?!\s*(?:void\s*\(\s*0\s*\)\s*;?|;)?\s*(?:$|[\"',}\]&])))|(?:\bon(?:error|load|mouseover|focus|click)\s*=)|(?:<\s*(?:img|svg|iframe|body)\b[^<>]{0,512}\bon\w+)|(?:document\.(?:cookie|domain))" "t:none,t:lowercase,t:compressWhitespace"

# rce / phạm vi raw: 1 mẫu
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_HEADERS:User-Agent "@rx (?:(?:;|\||`|&&?|\$\()\s*(?:/(?:usr/)?s?bin/)?(?:cat|ls|id|whoami|uname|wget|curl|nc|ncat|bash|sh|python[23]?|perl|php|chmod|pwd|hostname|base64|powershell|ifconfig|nslookup)(?=$|[\s;|&<>`)'\"]))" "id:1000204,phase:2,deny,status:403,log,auditlog,t:none,t:lowercase,t:urlDecodeUni,t:urlDecodeUni,multiMatch,msg:'NSM tier1 rce',tag:'nsm/tier1',tag:'nsm/tier1/rce',tag:'nsm/scope/raw',logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',severity:'CRITICAL'"
SecRule REQBODY_PROCESSOR "@rx ^(?:XML|MULTIPART)$" "id:1000205,phase:2,deny,status:403,log,auditlog,t:none,msg:'NSM tier1 rce',tag:'nsm/tier1',tag:'nsm/tier1/rce',tag:'nsm/scope/raw',logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',severity:'CRITICAL',chain"
    SecRule STREAM_INPUT_BODY "@rx (?:(?:;|\||`|&&?|\$\()\s*(?:/(?:usr/)?s?bin/)?(?:cat|ls|id|whoami|uname|wget|curl|nc|ncat|bash|sh|python[23]?|perl|php|chmod|pwd|hostname|base64|powershell|ifconfig|nslookup)(?=$|[\s;|&<>`)'\"]))" "t:none,t:lowercase"

# rce / phạm vi rawonly: 1 mẫu
SecRule ARGS_GET "@rx (?:(?:^|[;|&`])[^\s;|&`]{1,64}[\r\n]+\s*(?:/(?:usr/)?s?bin/)?(?:cat|ls|id|whoami|uname|wget|curl|nc|ncat|bash|sh|python[23]?|perl|php|chmod|pwd|hostname|base64|powershell|ifconfig|nslookup)(?=$|[\s;|&<>`)'\"]))" "id:1000206,phase:2,deny,status:403,log,auditlog,t:none,t:lowercase,t:urlDecodeUni,t:urlDecodeUni,multiMatch,msg:'NSM tier1 rce',tag:'nsm/tier1',tag:'nsm/tier1/rce',tag:'nsm/scope/rawonly',logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',severity:'CRITICAL'"
SecRule REQBODY_PROCESSOR "!@rx ^(?:JSON|XML)$" "id:1000207,phase:2,deny,status:403,log,auditlog,t:none,msg:'NSM tier1 rce',tag:'nsm/tier1',tag:'nsm/tier1/rce',tag:'nsm/scope/rawonly',logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',severity:'CRITICAL',chain"
    SecRule ARGS_POST "@rx (?:(?:^|[;|&`])[^\s;|&`]{1,64}[\r\n]+\s*(?:/(?:usr/)?s?bin/)?(?:cat|ls|id|whoami|uname|wget|curl|nc|ncat|bash|sh|python[23]?|perl|php|chmod|pwd|hostname|base64|powershell|ifconfig|nslookup)(?=$|[\s;|&<>`)'\"]))" "t:none,t:lowercase,t:urlDecodeUni,t:urlDecodeUni,multiMatch"

