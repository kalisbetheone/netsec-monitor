<IfModule security2_module>
    # Ghi nhật ký kiểm toán (kèm THÂN request) cho MỌI request có thân, kể cả khi không luật nào
    # khớp. SecAuditEngine mặc định là RelevantOnly nên trước đây thân của POST "sạch" và của
    # POST độc hại mà CRS bỏ lọt không được ghi -> tầng phát hiện không nhìn thấy payload trong
    # thân, và corpus lành tính không có thân POST. id 9800001 nằm ngoài dải CRS (9xxxxx).
    SecRule REQUEST_METHOD "!@rx ^(?:GET|HEAD|OPTIONS)$" \
        "id:9800001,phase:1,pass,nolog,ctl:auditEngine=On"

    # Luật do hệ thống tự sinh (rulegen -> enforcer -> watch-rules.sh)
    Include /etc/modsecurity/autogen/active.conf

    # Tầng 1 của classifier chạy ĐỒNG BỘ (tools/gen_tier1_modsec.py, id 1000200–1000399). Nạp SAU CRS và SAU luật
    # tự sinh: hai lớp đó chặn trước thì vẫn được ghi công; luật này chỉ bắt phần cả hai bỏ lọt.
    Include /etc/modsecurity/nsm-sync/tier1.conf
</IfModule>
