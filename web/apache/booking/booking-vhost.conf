# booking-vhost.conf — vhost của cổng đặt chỗ (booking.local).
# Đặt vào /etc/apache2/sites-available/ với tên xếp SAU 000-default.conf (ví dụ 010-booking.conf) rồi a2ensite:
# vhost nạp đầu tiên (000-default, dvwa.local) vẫn là vhost mặc định cho mọi Host khác.
<VirtualHost *:80>
    ServerName booking.local
    DocumentRoot /var/www/booking/public

    # Đường dẫn CSDL SQLite cho ứng dụng (lib.php đọc qua $_SERVER / getenv)
    SetEnv BOOKING_DB /var/lib/booking/booking.db

    DirectoryIndex index.php

    <Directory /var/www/booking/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # ---- Phần dưới chép theo 000-default.conf của NSM để nhật ký và IP thật giống vhost DVWA ----
    # (cần mod_remoteip, định dạng nhật ký "json" trong logjson.conf và thư mục /var/log/apache-json;
    #  dùng ngoài image NSM thì bỏ 5 dòng này)
    RemoteIPHeader X-Real-IP
    RemoteIPTrustedProxy 127.0.0.1
    RemoteIPInternalProxy 172.16.0.0/12
    ErrorLog  /var/log/apache-json/error.log
    CustomLog /var/log/apache-json/access.json json
</VirtualHost>
