<VirtualHost *:80>
    ServerName dvwa.local
    DocumentRoot /var/www/html

    # IP thật đến từ nginx (host) qua cổng publish → tin loopback & mạng docker
    RemoteIPHeader X-Real-IP
    RemoteIPTrustedProxy 127.0.0.1
    RemoteIPInternalProxy 172.16.0.0/12

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # error.log ghi ra tệp trong volume nhật ký để Filebeat thu (topic web.errors -> chỉ mục apache-errors-*)
    ErrorLog  /var/log/apache-json/error.log
    CustomLog /var/log/apache-json/access.json json
</VirtualHost>
