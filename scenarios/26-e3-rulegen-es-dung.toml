title = "E3: Elasticsearch dừng — phát hiện và chặn vẫn chạy, bộ sinh luật phải dừng hẳn"
case = "E3"
notes = """Bổ sung cho kịch bản 17 (phần rulegen của ca E3). CRS tạm DetectionOnly để tấn công lọt và đủ điều kiện gom cụm. \
Elasticsearch dừng từ giây 5 tới giây 120: rulegen không kiểm chứng được corpus nên KHÔNG được sinh hay ban hành luật trong \
khoảng này; kẻ tấn công vẫn phải bị chặn IP (đường phát hiện không phụ thuộc Elasticsearch). Sau khi Elasticsearch trở lại, \
rulegen có thể sinh luật (đúng thiết kế)."""
max_s = 240
rulegen = true
modsec_detection_only_s = 120

[override.rulegen]
INTERVAL_S = "15"
SHADOW_S = "20"                # chỉ có tác dụng khi RULE_APPLY=shadow; mặc định từ 15/11/2026 là áp dụng ngay
LOOKBACK_S = "900"

[[fault]]
service = "elasticsearch"
stop_at_s = 5
start_at_s = 120

[[actor]]
name = "RCE trong lúc Elasticsearch dừng"
ips = 2
start_s = 15
family = "rce_seed"
path = "/vulnerabilities/exec/"
param = "ip"
method = "POST"
count = 60
interval_s = 0.5               # gửi liên tục (tới khi bị Cổng 1 chặn) như kịch bản 17

[expect]
attack_blocked = true
no_rule_created_during = "elasticsearch"
