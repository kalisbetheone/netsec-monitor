# Bản rút gọn của scenarios/41-luat-ap-dung-ngay-go-lai.toml cho tools/present.sh (chỉ giảm số lượng / thời gian).
title = "Luật tự sinh áp dụng ngay: chặn ngay ở chu kỳ kế tiếp, có cảnh báo, gỡ được bằng một lệnh — bản trình diễn (giữ nguyên thời gian hai pha)"
case = "mở rộng (rulegen, hướng D 15/11/2026)"
notes = """Pha 1 (CRS và luật tầng 1 đồng bộ chỉ ghi nhận 70 giây): 2 IP gửi RCE nối lệnh vào ô ip của DVWA -> rulegen (chu kỳ 15 \
giây) sinh luật và luật CHẶN NGAY, không qua chạy thử. Pha 2 (giây 150): 6 IP MỚI gửi biến thể chưa thấy -> phải bị luật tự sinh \
chặn ở Cổng 2. Cảnh báo Grafana 'luật tự sinh vừa bắt đầu chặn' phải bật. Việc gỡ bằng nsmctl rule-revoke được kiểm ở \
tests/test_logic.py và trong báo cáo kiểm tra thủ công."""
max_s = 240
rulegen = true
modsec_detection_only_s = 70

[override.rulegen]
RULE_APPLY = "immediate"
INTERVAL_S = "15"
LOOKBACK_S = "900"

[[actor]]
name = "gieo tấn công"
ips = 2
family = "rce_seed"
path = "/vulnerabilities/exec/"
param = "ip"
method = "POST"
count = 8
interval_s = 0.5

[[actor]]
name = "IP mới, biến thể chưa thấy"
role = "verify"
ips = 6
start_s = 150
family = "rce_variant"
shuffle = true
path = "/vulnerabilities/exec/"
param = "ip"
method = "POST"
count = 2
interval_s = 1
stop_on_block = false

[expect]
rule_classes_active = ["rce"]
verify_gate2_min_share = 0.8
alert_fired = "NSM: luật tự sinh vừa được ban hành"
