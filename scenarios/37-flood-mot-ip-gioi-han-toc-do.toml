title = "Flood từ một IP: Cổng 1 giới hạn tốc độ ngay (429), rồi IP bị chặn hẳn"
case = "C3 mở rộng (giới hạn tốc độ)"
notes = """Một IP gửi 1 500 request liên tục. Trước 15/11 mọi request tới Apache cho tới khi tầng 3 chặn (khoảng 4 giây). \
Nay nginx chỉ cho qua 20 request/giây (vượt ngắn 40), phần còn lại nhận 429 ngay; tầng 3 thấy cả request bị 429 nên vẫn chặn \
hẳn IP. Người dùng khác vẫn dùng bình thường."""
max_s = 120

[[actor]]
name = "flood"
family = "benign"
count = 1500
interval_s = 0

[[actor]]
name = "người dùng"
role = "benign"
family = "benign"
count = 60
interval_s = 0.5
stop_on_block = false

[expect]
attack_blocked = true
block_within_s = 15
attack_429_min_share = 0.3
benign_blocked = false
benign_429_max_share = 0.01
benign_ok_min_share = 0.99
