title = "Các họ tấn công mới, mỗi họ một IP, đặt đúng vị trí điển hình"
case = "mở rộng"
notes = "SSRF, SSTI, NoSQLi, LDAP, CRLF, open redirect, RFI, deserialization ở query; XXE ở thân XML; Log4Shell ở User-Agent; Shellshock ở header; tải tệp PHP qua multipart. 15 request mỗi họ."
