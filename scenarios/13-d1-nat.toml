title = "NAT dùng chung: ba người dùng thật và một kẻ tấn công chung một IP, mỗi người một trình duyệt"
case = "D1"
notes = "Một IP xen kẽ 3 request hợp lệ (3 trình duyệt khác nhau), 1 request tấn công (sqlmap). tier3 nhận ra IP có nhiều User-Agent và báo responder đây là IP dùng chung; responder chặn theo (IP, User-Agent) nên chỉ kẻ tấn công bị chặn. Trước khi có D1 (lượt chạy thử 12/11): 57/75 request hợp lệ bị chặn theo. Nếu kẻ tấn công dùng ĐÚNG User-Agent của người dùng thì vẫn chặn lây — giới hạn của dấu vân tay chỉ dựa trên User-Agent."
max_s = 120

